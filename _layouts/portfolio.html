<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }}</title>
  <meta name="description" content="Personal site of {{ page.site_name | escape }}.">
  <style>
    /* Edit these values to change the site's colors. */
    :root {
      color-scheme: light;
      --background: #fff;
      --text: #191a1d;
      --muted: #545860;
      --navy: #14233d;
      --line: #d9dde3;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font: 1rem/1.65 system-ui, sans-serif;
    }
    a { color: var(--navy); text-underline-offset: .25em; }
    a:hover { text-decoration-thickness: .14em; }
    a:focus-visible { outline: 2px solid var(--navy); outline-offset: 4px; }
    .wrap { width: min(100% - 2rem, 65rem); margin-inline: auto; }
    .site-header, footer { border-bottom: 1px solid var(--line); }
    .site-header .wrap {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: .5rem 2rem;
      padding-block: 1rem;
    }
    .brand { font-weight: 750; text-decoration: none; }
    nav { display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; }
    nav a { font-size: .9rem; }
    h1, h2, h3 { color: var(--navy); line-height: 1.15; margin: 0; }
    h1 { font-size: clamp(1.85rem, 5vw, 3rem); letter-spacing: -.04em; }
    h2 { font-size: clamp(1.5rem, 4vw, 2rem); letter-spacing: -.025em; }
    h3 { font-size: 1.15rem; }
    p { margin: .75rem 0 0; max-width: 64ch; }
    main > h2 {
      border-top: 1px solid var(--line);
      padding-top: 2rem;
      margin-top: 2rem;
    }
    main { padding-block: clamp(2rem, 8vw, 6rem); }
    main > h3 { margin-top: 1.25rem; }
    footer { border-block: 1px solid var(--line) 0; padding-block: 1.25rem; color: var(--muted); }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">{{ page.site_name | escape }}</a>
      <nav aria-label="Main navigation">
        <a href="#biography">Biography</a>
        <a href="#github-repositories">Repositories</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer>
    <div class="wrap">{{ page.site_name | escape }}</div>
  </footer>
</body>
</html>
