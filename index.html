<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Write your name and a short site description here. -->
  <title>TrirayanB | Portfolio</title>
  <meta name="description" content="Biography, projects, and GitHub repositories from TrirayanB.">
  <style>
    /* Edit these values to change the site's colors. */
    :root {
      color-scheme: light;
      --background: #fff;
      --text: #191a1d;
      --muted: #545860;
      --navy: #14233d;
      --line: #d9dde3;
      --panel: #f3f4f6;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font: 1rem/1.65 system-ui, sans-serif;
    }
    a { color: var(--navy); text-underline-offset: .25em; }
    a:hover { text-decoration-thickness: .14em; }
    a:focus-visible { outline: 2px solid var(--navy); outline-offset: 4px; }
    .wrap { width: min(100% - 2rem, 65rem); margin-inline: auto; }
    .site-header, footer { border-bottom: 1px solid var(--line); }
    .site-header .wrap {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: .5rem 2rem;
      padding-block: 1rem;
    }
    .brand { font-weight: 750; text-decoration: none; }
    nav { display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; }
    nav a { font-size: .9rem; }
    h1, h2, h3 { color: var(--navy); line-height: 1.15; margin: 0; }
    h1 { font-size: clamp(3rem, 9vw, 6.5rem); letter-spacing: -.065em; }
    h2 { font-size: clamp(1.5rem, 4vw, 2rem); letter-spacing: -.025em; }
    h3 { font-size: 1.15rem; }
    p { margin: .75rem 0 0; max-width: 64ch; }
    .intro { padding-block: clamp(3rem, 10vw, 7rem); }
    .intro p { font-size: 1.2rem; color: var(--muted); }
    .section {
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: minmax(11rem, 1fr) minmax(0, 2fr);
      gap: 1rem 2rem;
      padding-block: 2rem;
    }
    .section > div > :first-child { margin-top: 0; }
    .repo {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: .75rem;
      padding: 1.25rem;
    }
    .repo + .repo { margin-top: 1rem; }
    .repo p { color: var(--muted); }
    footer { border-block: 1px solid var(--line) 0; padding-block: 1.25rem; color: var(--muted); }
    @media (max-width: 40rem) {
      .section { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <!-- Replace the site name here and in the main heading below. -->
      <a class="brand" href="./">TrirayanB</a>
      <nav aria-label="Main navigation">
        <a href="#biography">Biography</a>
        <a href="#repositories">Repositories</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <header class="intro">
      <!-- Write your display name and a one-line introduction here. -->
      <h1>TrirayanB</h1>
      <p>My personal site and GitHub projects.</p>
    </header>

    <section class="section" id="biography">
      <h2>Biography</h2>
      <div>
        <!-- Write your biography here. Add a paragraph for your background,
             interests, or what you are working on. Then remove the sample line. -->
        <p>My biography is coming soon.</p>
      </div>
    </section>

    <section class="section" id="repositories">
      <h2>GitHub repositories</h2>
      <div>
        <!-- Copy this article for each repository you want to feature.
             Update the GitHub URL, repository name, and short description. -->
        <article class="repo">
          <h3><a href="https://github.com/TrirayanB/TrirayanB.github.io">TrirayanB.github.io</a></h3>
          <p>The source code for this website.</p>
        </article>
        <p><a href="https://github.com/TrirayanB?tab=repositories">Browse all repositories on GitHub</a></p>
      </div>
    </section>

    <!-- To add a section such as Skills or Experience, copy a section above,
         give it a unique id, and add a navigation link pointing to that id. -->

    <section class="section" id="contact">
      <h2>Contact</h2>
      <div>
        <!-- Add any public email address or social links you want to share here. -->
        <p><a href="https://github.com/TrirayanB">Find me on GitHub</a></p>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">TrirayanB</div>
  </footer>
</body>
</html>
